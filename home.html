<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PERFUMY | Home</title>

    <!-- Google Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
          rel="stylesheet">


    <!-- EXTERNAL CSS -->
    <link rel="stylesheet" href="style.css">


    <!-- INTERNAL CSS -->
    <style>

        :root {
            --bg-color: #0d0d0d;
            --surface-color: #161616;
            --surface-light: #222222;
            --accent-color: #d4af37;
            --accent-hover: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #2a2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.9),
                transparent
            );

            text-align: center;
            padding: 60px 20px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 45px;
            font-weight: 400;
            letter-spacing: 7px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        header p {
            color: var(--accent-color);
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(13, 13, 13, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 20px 25px;
            transition: 0.4s;
        }

        nav a:hover {
            color: var(--accent-color);
            background-color: #222;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
            max-width: 900px;
            margin: auto;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            font-style: italic;
            margin-bottom: 20px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 40px;
        }

        .hero img {
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 50% 50% 0 0;
            border: 2px solid var(--accent-color);
            padding: 10px;
            transition: 0.4s;
        }

        .hero img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px
                rgba(212, 175, 55, 0.4);
        }

        .inline-example {
            color: var(--accent-color);
            text-align: center;
            font-family: 'Playfair Display', serif;
            margin: 30px;
        }

        footer {
            background-color: #060606;
            color: var(--text-muted);
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
        }

        @media(max-width:768px) {

            header h1 {
                font-size: 30px;
            }

            .hero h1 {
                font-size: 34px;
            }

            nav a {
                padding: 15px 10px;
                font-size: 11px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <h1>PERFUMY</h1>

        <p>Haute Parfumerie</p>

    </header>


    <!-- NAVIGATION -->

    <nav>

        <a href="Home.html">Home</a>

        <a href="product.html">Products</a>

        <a href="about.html">About</a>

        <a href="contact.html">Contact</a>

    </nav>


    <!-- HERO -->

    <section class="hero">

        <h1>Elegance in Every Drop</h1>

        <p>
            Discover rare, masterfully crafted luxury fragrances
            designed for the modern connoisseur.
        </p>

        <img
        src="https://img.magnific.com/premium-vector/luxury-bottle-perfume-logo-template_982269-618.jpg?semt=ais_hybrid&w=740&q=80"
        alt="Luxury Perfume Logo">

    </section>


    <!-- INLINE CSS EXAMPLE -->

    <h2
        style="color:#d4af37;
               text-align:center;
               font-family:'Playfair Display',serif;
               margin:30px;">

        Welcome to Perfumy Premium Brand

    </h2>


    <!-- FOOTER -->

    <footer>

        <p>

            © 2026 Perfumy Premium Brand
            | Haute Parfumerie
            | All Rights Reserved

        </p>

    </footer>


</body>

</html>
